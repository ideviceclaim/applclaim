<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Template Editor - Shiraz Apple Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 20px;
            min-height: 100vh;
        }

        .editor-section {
            flex: 1;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .preview-section {
            flex: 1.5;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .section-title {
            color: #0071e3;
            margin: 25px 0 15px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
            font-size: 18px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #0071e3;
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.1);
        }

        .uppercase {
            text-transform: uppercase;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .preview-container {
            width: 100%;
            height: 100%;
            border: none;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        .btn-primary {
            background: #0071e3;
            color: white;
            flex: 2;
        }

        .btn-primary:hover {
            background: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 113, 227, 0.3);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            flex: 1;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .logo img {
            width: 32px;
            height: 32px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: #34c759;
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .tooltip {
            position: relative;
            display: inline-block;
            margin-left: 5px;
            color: #888;
            cursor: help;
        }

        .tooltip .tooltiptext {
            visibility: hidden;
            width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 10px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -100px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 12px;
            font-weight: normal;
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }

        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
            }
            
            .editor-section, .preview-section {
                flex: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Editor Section -->
        <div class="editor-section">
            <div class="logo">
                <img src="https://trackmygts.com/images/logo.svg" alt="Logo">
                <span class="logo-text">Email Template Editor</span>
            </div>
            
            <h1>Claim Approval Email Editor</h1>
            <p class="subtitle">Edit the email template below. Changes update in real-time.</p>

            <!-- Product Details Box -->
            <div class="section-title">Product Details</div>
            
            <div class="form-group">
                <label for="productTitle">Product Title <span class="tooltip">?
                    <span class="tooltiptext">This appears in the product box and in the Device field</span>
                </span></label>
                <input type="text" id="productTitle" placeholder="e.g., 13-inch iPad Air with M3" value="13-inch iPad Air with M3">
            </div>

            <div class="form-group">
                <label for="productDescription">Product Description</label>
                <input type="text" id="productDescription" placeholder="e.g., 13-inch iPad Air with M3: Big on Power, Ready for Anything..." value="13-inch iPad Air with M3: Big on Power, Ready for Anything. Includes a 20W USB-C adapter and a one-year limited warranty.">
            </div>

            <div class="form-group">
                <label for="productImage">Product Image URL</label>
                <input type="text" id="productImage" placeholder="e.g., https://trackmygts.com/images/idevice_13inchiPad.jpg" value="https://trackmygts.com/images/idevice_13inchiPad.jpg">
            </div>

            <!-- Claim Details Table -->
            <div class="section-title">Claim Details</div>
            
            <div class="form-group">
                <label for="claimId">Claim ID</label>
                <input type="text" id="claimId" placeholder="e.g., SHZ025-3593" value="SHZ025-3593">
            </div>

            <div class="form-group">
                <label for="customerName">Customer Name</label>
                <input type="text" id="customerName" placeholder="e.g., SAKINAH SUHANIF" value="SAKINAH SUHANIF" class="uppercase">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="validFor">Valid For</label>
                    <select id="validFor">
                        <option value="72 hours" selected>72 hours</option>
                        <option value="48 hours">48 hours</option>
                        <option value="24 hours">24 hours</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="price">Price</label>
                    <select id="price">
                        <option value="{Sponsored}" selected>{Sponsored}</option>
                        <option value="{Discounted}">{Discounted}</option>
                        <option value="{Promotion}">{Promotion}</option>
                        <option value="{Student Offer}">{Student Offer}</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <select id="quantity">
                        <option value="1" selected>1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                </div>
            </div>

            <!-- Delivery Information -->
            <div class="section-title">Delivery Information</div>
            
            <div class="form-group">
                <label for="customerAddress">Customer Address</label>
                <input type="text" id="customerAddress" placeholder="e.g., 53 jalan AP 1C/7 taman alam perdana puncak alam 42300 puncak alam selangor" value="53 jalan AP 1C/7 taman alam perdana puncak alam 42300 puncak alam selangor" class="uppercase">
            </div>

            <div class="buttons">
                <button id="updatePreview" class="btn-primary">Update Preview</button>
                <button id="resetForm" class="btn-secondary">Reset to Default</button>
            </div>

            <div class="status-indicator" id="statusIndicator">
                <span>✓</span>
                <span>Preview Updated</span>
            </div>
        </div>

        <!-- Preview Section -->
        <div class="preview-section">
            <iframe id="emailPreview" class="preview-container"></iframe>
        </div>
    </div>

    <script>
        // Default template
        const defaultTemplate = `<!-- START EMAIL HTML -->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background-color: #f5f5f7; padding: 20px;">

    <tbody>

        <td style="width: 50px;"></td>
        <td>
          <img src="https://trackmygts.com/images/logo.svg" alt="TrackMyGTS Logo" width="42" height="42" style="max-width: 100%; height: auto; border: none; padding: 0; margin: 0;">

      <tr height="20">

      <tr>
        <td colspan="4" align="center">
          <table id="content-tbl" border="0" cellpadding="0" cellspacing="0" style="width: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 13px;">
            <tbody>
              <tr height="10">
                <td bgcolor="#f5f5f5" colspan="3" style="border-top-right-radius: 2px;">&nbsp;</td>

                <td bgcolor="#f5f5f5" align="left">
                  <table border="0" cellpadding="0" cellspacing="0" valign="middle" style="border-collapse: collapse; border-spacing: 0px; background-color: #ffffff; border-radius: 3px; font-size: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;">
                    <tbody>
                      <tr>
                        <td valign="top" align="center" style="padding: 20px 0 20px 20px;">
                          <img src="{{productImage}}" alt="{{productTitle}}" width="100" height="100" border="0" style="max-width: 100%; height: auto; border-radius: 8px; border: 1px solid rgba(128, 128, 128, 0.2);">
                        </td>

                              <tr>
                                <td style="font-size: 13px; color: #666666;">
                                  {{productDescription}}

                              <tr height="10">

                              </tr>
                              <tr>
                                <td>
                                  <div style="display: inline-block; background-color: #34c759; color: #ffffff; padding: 4px 10px; border-radius: 20px; font-weight: 700; font-size: 12px;">
                                    APPROVED ✅
                                  </div>
                                </td>
                              </tr>
                            </tbody>
                          </table>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </td>
                <td bgcolor="#f5f5f5" style="width: 20px;">&nbsp;</td>
              </tr>
              
              <tr height="10">
                <td bgcolor="#f5f5f5" colspan="3" style="border-bottom-right-radius: 2px;">&nbsp;</td>
              </tr>
              
              <tr class="paragraph-spacer" style="height: 20px;">
                <td>&nbsp;</td>
              </tr>
              
              <tr>
                <td style="width: 20px;"></td>
                <td style="font-size: 13px; color: #333333;">
                  Dear {{customerName}},
                </td>
                <td style="width: 20px;"></td>
              </tr>
              
              <tr class="paragraph-spacer" style="height: 20px;">
                <td>&nbsp;</td>
              </tr>
              
              <tr>
                <td style="width: 20px;"></td>
                <td style="font-size: 13px; color: #333333;">
                  Great news — your iDevice claim has been approved and is ready for the next steps.
                </td>
                <td style="width: 20px;"></td>
              </tr>
              
              <tr class="paragraph-spacer" style="height: 20px;">
                <td>&nbsp;</td>
              </tr>
              
              <tr>
                <td style="width: 20px;"></td>
                <td align="center">
                  <table border="0" cellpadding="0" cellspacing="1" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 13px;">
                    <tbody>
                      <tr>
                        <td valign="top" align="right" style="padding-bottom: 8px;"><b style="font-size: 13px;">Claim ID</b></td>
                        <td width="10"></td>
                        <td valign="top" align="left" style="padding-bottom: 8px; font-size: 13px;">{{claimId}}</td>
                      </tr>
                      <tr>
                        <td valign="top" align="right" style="padding-bottom: 8px;"><b style="font-size: 13px;">Customer</b></td>
                        <td width="10"></td>
                        <td valign="top" align="left" style="padding-bottom: 8px; font-size: 13px;">{{customerName}}</td>
                      </tr>
                      <tr>
                        <td valign="top" align="right" style="padding-bottom: 8px;"><b style="font-size: 13px;">Device</b></td>
                        <td width="10"></td>
                        <td valign="top" align="left" style="padding-bottom: 8px; font-size: 13px;">{{productTitle}}</td>
                      </tr>
                      <tr>
                        <td valign="top" align="right" style="padding-bottom: 8px;"><b style="font-size: 13px;">Valid For</b></td>
                        <td width="10"></td>
                        <td valign="top" align="left" style="padding-bottom: 8px; font-size: 13px;">{{validFor}}</td>
                      </tr>
                      <tr>
                        <td valign="top" align="right" style="padding-bottom: 8px;"><b style="font-size: 13px;">Price</b></td>
                        <td width="10"></td>
                        <td valign="top" align="left" style="padding-bottom: 8px; font-size: 13px;">{{price}}</td>
                      </tr>
                      <tr>
                        <td valign="top" align="right" style="padding-bottom: 8px;"><b style="font-size: 13px;">Quantity</b></td>
                        <td width="10"></td>
                        <td valign="top" align="left" style="padding-bottom: 8px; font-size: 13px;">{{quantity}}</td>
                      </tr>
                    </tbody>
                  </table>
                </td>
                <td style="width: 20px;"></td>
              </tr>
              
              <tr class="paragraph-spacer" style="height: 20px;">
                <td>&nbsp;</td>
              </tr>
              
              <tr>
                <td style="width: 20px;"></td>
                <td style="font-size: 13px; color: #333333;">
                  <b>Next Step:</b> Click the button below to email your Claim ID <strong>[{{claimId}}]</strong> for activation.
                </td>

              </tr>
              
              <tr class="paragraph-spacer" style="height: 15px;">
                <td>&nbsp;</td>
              </tr>
              
              <tr>
                <td style="width: 20px;"></td>
                <td align="center">
                  <a href="mailto:admin@trackmygts.com?subject=Claim%20Activation%20Request&body=Hello,%20I%20would%20like%20to%20activate%20my%20claim%20ID%20{{claimId}}.%20My%20name%20is%20{{customerName}}." 
                     style="display: inline-block; background-color: #0071e3; color: #ffffff; padding: 12px 24px; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 14px;">
                    Activate Your iDevice
                  </a>
                </td>
                <td style="width: 20px;"></td>
              </tr>
              
              <tr class="paragraph-spacer" style="height: 20px;">
                <td>&nbsp;</td>
              </tr>
              
              <tr>
                <td style="width: 20px;"></td>
                <td style="font-size: 13px; color: #333333;">
                  <b>Important:</b> Activation must be completed within {{validFor}} to secure your device.
                </td>
                <td style="width: 20px;"></td>
              </tr>
              
              <tr class="paragraph-spacer" style="height: 20px;">
                <td>&nbsp;</td>
              </tr>
              
              <tr>
                <td style="width: 20px;"></td>
                <td style="font-size: 13px; color: #333333;">
                  <b>Delivery Information:</b> After activation, your device will be delivered to:
                  <div style="margin-top: 8px; font-size: 13px; line-height: 1.4;">
                    {{customerAddress}}
                  </div>
                </td>
                <td style="width: 20px;"></td>
              </tr>
              
              <tr class="paragraph-spacer" style="height: 20px;">
                <td>&nbsp;</td>
              </tr>
              
              <tr>
                <td style="width: 20px;"></td>
                <td style="font-size: 13px; color: #333333;">
                  If you have any questions, please contact us at <a href="mailto:shirazstore@icloud.com" style="color: #0071e3; text-decoration: none;">shirazstore@icloud.com</a>.
                </td>
                <td style="width: 20px;"></td>
              </tr>
              
              <tr class="paragraph-spacer" style="height: 20px;">
                <td>&nbsp;</td>
              </tr>
              
              <tr>
                <td style="width: 20px;"></td>
                <td style="font-size: 13px; color: #333333;">
                  Thank you,
                  <br><br>
                  <strong>Shiraz Apple Store</strong>
                </td>
                <td style="width: 20px;"></td>
              </tr>
              
              <tr class="paragraph-spacer" style="height: 20px;">
                <td>&nbsp;</td>
              </tr>
            </tbody>
          </table>
        </td>
      </tr>
      
      <tr class="footer-spacer" style="height: 30px;">
        <td colspan="4">&nbsp;</td>
      </tr>
      
      <tr>
        <td></td>
        <td colspan="2" align="center" style="font-size: 12px; color: #666666;">
          For help with claims and activation, visit 
          <a href="https://trackmygts.com/activate" style="color: #0071e3; font-size: 12px; text-decoration: none;">Activation Portal</a> | 
          <a href="mailto:shirazstore@icloud.com" style="color: #0071e3; font-size: 12px; text-decoration: none;">Contact Support</a>
        </td>
        <td></td>
      </tr>
      
      <tr height="15">
        <td colspan="4">&nbsp;</td>
      </tr>
      
      <tr>
        <td></td>
        <td colspan="2" align="center" dir="auto" style="font-size: 12px; color: #666666;">
          ShirazAppleStore | Digital Service Center | Shah Alam, Selangor.<br>
          (873719-X) Copyright © 2025<br>
          All rights reserved
        </td>

      </tr>
      
      <tr height="25">

        // DOM elements
        const formElements = {
            productTitle: document.getElementById('productTitle'),
            productDescription: document.getElementById('productDescription'),
            productImage: document.getElementById('productImage'),
            claimId: document.getElementById('claimId'),
            customerName: document.getElementById('customerName'),
            validFor: document.getElementById('validFor'),
            price: document.getElementById('price'),
            quantity: document.getElementById('quantity'),
            customerAddress: document.getElementById('customerAddress')
        };

        const updatePreviewBtn = document.getElementById('updatePreview');
        const resetFormBtn = document.getElementById('resetForm');
        const emailPreview = document.getElementById('emailPreview');
        const statusIndicator = document.getElementById('statusIndicator');

        // Auto-uppercase for customer name and address
        formElements.customerName.addEventListener('input', function() {
            this.value = this.value.toUpperCase();
        });

        formElements.customerAddress.addEventListener('input', function() {
            this.value = this.value.toUpperCase();
        });

        // Function to update email preview
        function updateEmailPreview() {
            let emailHTML = defaultTemplate;
            
            // Replace all placeholders with form values
            for (const [key, element] of Object.entries(formElements)) {
                const placeholder = `{{${key}}}`;
                const value = element.value || element.options[element.selectedIndex]?.value || '';
                emailHTML = emailHTML.split(placeholder).join(value);
            }

            // Encode for iframe
            const encodedHTML = encodeURIComponent(emailHTML);
            emailPreview.src = 'data:text/html;charset=utf-8,' + encodedHTML;

            // Show status indicator
            statusIndicator.style.display = 'inline-flex';
            setTimeout(() => {
                statusIndicator.style.display = 'none';
            }, 2000);
        }

        // Function to reset form to default values
        function resetForm() {
            formElements.productTitle.value = "13-inch iPad Air with M3";
            formElements.productDescription.value = "13-inch iPad Air with M3: Big on Power, Ready for Anything. Includes a 20W USB-C adapter and a one-year limited warranty.";
            formElements.productImage.value = "https://trackmygts.com/images/idevice_13inchiPad.jpg";
            formElements.claimId.value = "SHZ025-3593";
            formElements.customerName.value = "SAKINAH SUHANIF";
            formElements.validFor.value = "72 hours";
            formElements.price.value = "{Sponsored}";
            formElements.quantity.value = "1";
            formElements.customerAddress.value = "53 jalan AP 1C/7 taman alam perdana puncak alam 42300 puncak alam selangor";
            
            updateEmailPreview();
            
            // Show reset confirmation
            statusIndicator.innerHTML = '<span>✓</span><span>Reset to Default</span>';
            statusIndicator.style.display = 'inline-flex';
            statusIndicator.style.backgroundColor = '#0071e3';
            
            setTimeout(() => {
                statusIndicator.style.display = 'none';
                statusIndicator.style.backgroundColor = '#34c759';
                statusIndicator.innerHTML = '<span>✓</span><span>Preview Updated</span>';
            }, 2000);
        }

        // Event listeners
        updatePreviewBtn.addEventListener('click', updateEmailPreview);
        resetFormBtn.addEventListener('click', resetForm);

        // Auto-update on form changes (optional - can be disabled if too heavy)
        Object.values(formElements).forEach(element => {
            element.addEventListener('change', updateEmailPreview);
            if (element.tagName === 'INPUT') {
                element.addEventListener('input', updateEmailPreview);
            }
        });

        // Initialize with default preview
        updateEmailPreview();
        statusIndicator.style.display = 'none';
    </script>
</body>
</html>
